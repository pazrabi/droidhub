<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}Phone Hub{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark-theme">
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <a href="/" class="brand-link">📱 Phone Hub</a>
      </div>
      <nav class="nav-links">
        {% if user %}
          <a href="/" class="nav-item">Устройства</a>
          <span class="user-badge" id="current-user">👤 {{ user }}</span>
          <form action="/logout" method="post" class="logout-form">
            <button type="submit" class="btn btn-sm btn-outline" id="btn-logout">Выйти</button>
          </form>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <footer class="app-footer">
    <div class="footer-container">
      <span>Phone Hub &copy; 2026</span>
    </div>
  </footer>

  <script src="/static/app.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
