{% extends "base.html" %}

{% block title %}Вход — Phone Hub{% endblock %}

{% block content %}
<div class="login-wrapper">
  <div class="login-card">
    <h1 class="login-title">Вход в Phone Hub</h1>
    <p class="login-subtitle">Управление Android-устройствами</p>

    {% if error %}
    <div class="alert alert-error" id="login-error-alert" role="alert">
      <span>Неверный логин или пароль, либо превышено число попыток</span>
    </div>
    {% endif %}

    <form action="/login" method="post" class="login-form">
      <div class="form-group">
        <label for="username">Имя пользователя</label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="Логин"
          required
          autocomplete="username"
          autofocus
        >
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="Пароль"
          required
          autocomplete="current-password"
        >
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">
        Войти
      </button>
    </form>
  </div>
</div>
{% endblock %}
